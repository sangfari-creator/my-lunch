<style>
/* Layout: left = step panel (big controls), right = 360x800 phone preview scaled to fit. Stacked on phones with a sticky preview. */
:root {

/* Fixed header (title + progress); only the content below it scrolls */
.app { height: 100%; min-height: 0; }

.swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--fg); }

/* ============ PHONE ============ */

/* Skins (device materials) */

.skin-craft { --s-bgfull: repeating-linear-gradient(45deg, #DCC49A 0 6px, #D6BC90 6px 12px); --s-card: #FBF3DF; --s-fg: #4A3520; --s-muted: #6F5A3D; --s-acc: #A85A14; --s-on: #FFFFFF; --s-bdc: #8A6A3B; --s-bs: dashed; --s-bw: 2px; --s-r: 8px; --s-sh: 4px 4px 0 rgba(90,60,20,.35); --s-head: #FBF3DF; }
/* 투명 (Transparent): 배경이 그대로 비치는 맑은 카드. 흐림(blur) 없이 얇은 테두리만 둬요. */

.skin-neu { --s-bgfull: #E4EAF0; --s-card: #E4EAF0; --s-fg: #3A4658; --s-muted: #66748A; --s-acc: #4B78C8; --s-on: #FFFFFF; --s-bdc: transparent; --s-bw: 0px; --s-r: 22px; --s-sh: 6px 6px 12px #BCC4CE, -6px -6px 12px #FFFFFF; }

/* 스푸키: 어두운 네온사인 배경 + 격자 + 빛나는 테두리와 장식 */
.skin-spooky { --s-bgfull: radial-gradient(circle at 15% 10%, rgba(255,60,172,.35), transparent 40%), radial-gradient(circle at 85% 90%, rgba(0,229,255,.28), transparent 45%), repeating-linear-gradient(0deg, rgba(255,138,31,.08) 0 1px, transparent 1px 26px), repeating-linear-gradient(90deg, rgba(255,138,31,.08) 0 1px, transparent 1px 26px), #14091F; --s-card: rgba(20,9,31,.72); --s-fg: #FFF4E6; --s-muted: #FFB87A; --s-acc: #FF8A1F; --s-on: #1A1024; --s-bdc: #FF8A1F; --s-bw: 2px; --s-r: 18px; --s-sh: 0 0 12px rgba(255,138,31,.6), inset 0 0 10px rgba(255,60,172,.25); }

.screen { overflow: hidden; }

function resolveTheme(text) {
  const t = text.trim().toLowerCase();
  if (!t) return null;
  const hit = THEMES.find(th => th.keys.some(k => t.includes(k)));
  if (hit) return {name: hit.name, deco: hit.deco, v: hit.v, made: false};
  let h = 0; for (const ch of t) h = (h * 31 + ch.charCodeAt(0)) % 360;
  const v = {"--s-bgfull": `linear-gradient(170deg,hsl(${h} 85% 90%),hsl(${(h + 40) % 360} 85% 95%))`, "--s-card": "#FFFFFF", "--s-fg": `hsl(${h} 50% 18%)`, "--s-muted": `hsl(${h} 30% 32%)`, "--s-acc": `hsl(${h} 70% 36%)`, "--s-on": "#FFFFFF", "--s-bdc": `hsl(${h} 65% 78%)`, "--s-bw": "3px", "--s-r": "24px", "--s-sh": `0 5px 0 hsl(${h} 60% 80% / .6)`};
  return {name: text.trim(), deco: ["✨","💫","🌟","🎀"], v, made: true};
}

$("panel").addEventListener("input", e => {

  if (e.target.id === "subTitle") { state.subTitle = e.target.value; renderPhone(); }
  if (e.target.id === "bubble") { state.bubble = e.target.value; renderPhone(); }
  if (e.target.id === "sSize") {
    const p = state.placed.find(x => x.id === state.selS);
    if (p) { p.s = Number(e.target.value); const el = scr.querySelector(`[data-sid="${p.id}"]`); if (el) el.style.fontSize = Math.round(44 * p.s) + "px"; }
  }
  if (e.target.id === "moodText") {
    applyMood(e.target.value); renderPhone();
    $("moodRes").textContent = moodMsg();
  }
});

/* Phone: select, delete, drag to reorder (mouse anywhere, touch from the ⠿ handle) */
const scr = $("screen");
let drag = null;
scr.addEventListener("click", e => {
  const d = e.target.closest(".del");
  if (d) { removeItem(Number(d.dataset.del)); }
});
scr.addEventListener("keydown", e => {
  const b = e.target.closest(".blk.wire"); if (!b || state.step !== 1) return;
  const id = Number(b.dataset.id);
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); state.sel = state.sel === id ? null : id; renderPhone(); renderPanel(); const n = scr.querySelector(`[data-id="${id}"]`); if (n) n.focus(); }
  if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); removeItem(id); }
});
scr.addEventListener("pointerdown", e => {
  const reorder4 = state.step === 4 && !state.finished;
  if ((state.step !== 1 && !reorder4) || e.target.closest(".del") || e.target.closest(".pst")) return;
  const rh = state.step === 1 ? e.target.closest(".rhandle") : null;
  if (rh) {
    const rb = rh.closest(".blk"), rr = rb.getBoundingClientRect();
    rs = {id: Number(rb.dataset.id), l: rr.left, t: rr.top};
    e.preventDefault();
    addEventListener("pointermove", rMove); addEventListener("pointerup", rUp); addEventListener("pointercancel", rUp);
    return;
  }
  const blk = e.target.closest(reorder4 ? ".blk.final" : ".blk.wire"); if (!blk) return;
  if (e.pointerType === "touch" && !e.target.closest(".grip")) return;
  drag = {id: Number(blk.dataset.id), blk, x: e.clientX, y: e.clientY, on: false, ghost: null, over: null};
  addEventListener("pointermove", onMove); addEventListener("pointerup", onUp); addEventListener("pointercancel", onCancel);
});
function onMove(e) {
  if (!drag) return;
  if (!drag.on) {
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 8) return;
    drag.on = true;
    const r = drag.blk.getBoundingClientRect();
    const g = drag.blk.cloneNode(true);
    const gsc = scr.getBoundingClientRect().width / 360, cs = getComputedStyle(scr);
    for (const k of ["--s-bgfull","--s-card","--s-fg","--s-muted","--s-acc","--s-on","--s-bdc","--s-bw","--s-r","--s-sh","--acc","--on-acc"]) g.style.setProperty(k, cs.getPropertyValue(k));
    g.className += " " + scr.className.replace("screen", "").trim();
    g.classList.add("ghost"); g.classList.remove("sel"); g.style.width = r.width / gsc + "px"; g.style.height = r.height / gsc + "px"; g.style.transformOrigin = "0 0"; g.style.transform = `scale(${gsc * 1.03})`; g.style.position = "fixed";
    g.style.left = r.left + "px"; g.style.top = r.top + "px"; g.dataset.dx = e.clientX - r.left; g.dataset.dy = e.clientY - r.top;
    document.body.appendChild(g); drag.ghost = g; drag.blk.classList.add("dragging");
  }
  e.preventDefault();
  const g = drag.ghost;
  g.style.left = e.clientX - g.dataset.dx + "px"; g.style.top = e.clientY - g.dataset.dy + "px";
  const it = state.items.find(x => x.id === drag.id), [w, h] = SD[it.size];
  const gr = $("grid").getBoundingClientRect(), sc = scr.getBoundingClientRect().width / 360;
  let c = Math.round(((e.clientX - g.dataset.dx - gr.left) / sc - 16) / 84) + 1, r = Math.round(((e.clientY - g.dataset.dy - gr.top) / sc - 16) / 84) + 1;
  c = Math.max(1, Math.min(5 - w, c)); r = Math.max(1, r);
  drag.tgt = {c, r}; drag.ok = fits(c, r, w, h, drag.id);
  const p = drag.ph || (drag.ph = document.createElement("div"));
  p.className = "dph" + (drag.ok ? "" : " bad"); p.style.gridColumn = `${c} / span ${w}`; p.style.gridRow = `${r} / span ${h}`;
  if (!p.parentNode) $("grid").appendChild(p);
}
function endDrag() {
  removeEventListener("pointermove", onMove); removeEventListener("pointerup", onUp); removeEventListener("pointercancel", onCancel);
  if (drag && drag.ghost) drag.ghost.remove();
  if (drag && drag.ph) drag.ph.remove();
}
function onUp() {
  if (!drag) return;
  const d = drag; endDrag(); drag = null;
  if (!d.on) { if (state.step === 1) { state.sel = state.sel === d.id ? null : d.id; renderPhone(); renderPanel(); } return; }
  if (d.ok) { const it = state.items.find(x => x.id === d.id); it.c = d.tgt.c; it.r = d.tgt.r; state.sel = d.id; renderAll(); } else renderPhone();
}
function onCancel() { endDrag(); drag = null; renderPhone(); }

/* Drag the ⤡ corner of a block to stretch it: wide -> 4x1 / 대 4x2 / 4x3 / 4x4 by height, narrow -> 중(2x2) or 소(2x1) */
let rs = null;
function rMove(e) {
  if (!rs) return;
  e.preventDefault();
  const sc = scr.getBoundingClientRect().width / 360;
  const w = (e.clientX - rs.l) / sc, h = (e.clientY - rs.t) / sc;
  const rows = h > 118 ? Math.min(4, 2 + Math.floor((h - 118) / 84)) : 1;
  const ns = w > 244 ? ["W","W","L","T","X"][rows] : rows > 1 ? "M" : "S";
  const it = state.items.find(x => x.id === rs.id);
  if (it && it.size !== ns) {
    const [nw, nh] = SD[ns], nc = Math.min(it.c, 5 - nw);
    if (fits(nc, it.r, nw, nh, it.id)) { it.size = ns; it.c = nc; state.sel = it.id; renderPhone(); }
  }
}
function rUp() {
  removeEventListener("pointermove", rMove); removeEventListener("pointerup", rUp); removeEventListener("pointercancel", rUp);
  rs = null; renderAll();
}

/* ---------- Stickers: drag from the tray onto the app, or drag placed ones to move ---------- */
let uidS = 1, sd = null;
function toPhone(cx, cy) {
  const ps = $("phScroll"), r = ps.getBoundingClientRect(), sc = scr.getBoundingClientRect().width / 360;
  return {x: Math.round((cx - r.left) / sc), y: Math.round((cy - r.top) / sc + ps.scrollTop)};
}
function overPhone(cx, cy) { const r = scr.getBoundingClientRect(); return cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom; }
function addSticker(e, x, y) {
  const p = {id: uidS++, e, x: Math.max(20, Math.min(340, x)), y: Math.max(20, y), s: 1};
  state.placed.push(p); state.selS = p.id; renderAll();
}
$("panel").addEventListener("pointerdown", ev => {
  const b = ev.target.closest(".sk"); if (!b || state.step !== 4 || state.finished) return;
  sd = {kind: "new", e: b.dataset.e, x: ev.clientX, y: ev.clientY, on: false, ghost: null};
  addEventListener("pointermove", sMove); addEventListener("pointerup", sUp); addEventListener("pointercancel", sCancel);
});
scr.addEventListener("pointerdown", ev => {
  if (state.step !== 4 || state.finished) return;
  if (ev.target.closest(".pdel")) return;
  const hd = ev.target.closest(".phandle");
  if (hd) {
    const pe = hd.closest(".pst");
    sd = {kind: "resize", id: Number(pe.dataset.sid), el: pe, x: ev.clientX, y: ev.clientY, on: true};
    ev.preventDefault();
    addEventListener("pointermove", sMove); addEventListener("pointerup", sUp); addEventListener("pointercancel", sCancel);
    return;
  }
  const el = ev.target.closest(".pst"); if (!el) return;
  const id = Number(el.dataset.sid), p = state.placed.find(x => x.id === id); if (!p) return;
  const pt = toPhone(ev.clientX, ev.clientY);
  sd = {kind: "move", id, el, x: ev.clientX, y: ev.clientY, on: false, ox: p.x - pt.x, oy: p.y - pt.y};
  ev.preventDefault();
  addEventListener("pointermove", sMove); addEventListener("pointerup", sUp); addEventListener("pointercancel", sCancel);
});
scr.addEventListener("click", ev => {
  const d = ev.target.closest(".pdel");
  if (d) { state.placed = state.placed.filter(x => x.id !== Number(d.dataset.sdel)); state.selS = null; renderAll(); }
});
function sMove(ev) {
  if (!sd) return;
  if (!sd.on) {
    if (Math.hypot(ev.clientX - sd.x, ev.clientY - sd.y) < 6) return;
    sd.on = true;
    if (sd.kind === "new") { const g = document.createElement("div"); g.className = "sghost"; g.textContent = sd.e; document.body.appendChild(g); sd.ghost = g; }
  }
  ev.preventDefault();
  if (sd.kind === "new") { sd.ghost.style.left = ev.clientX + "px"; sd.ghost.style.top = ev.clientY + "px"; sd.ghost.classList.toggle("ok", overPhone(ev.clientX, ev.clientY)); }
  else if (sd.kind === "resize") {
    const p = state.placed.find(x => x.id === sd.id), r = sd.el.getBoundingClientRect(), sc = scr.getBoundingClientRect().width / 360;
    const dist = Math.hypot(ev.clientX - (r.left + r.width / 2), ev.clientY - (r.top + r.height / 2)) / sc;
    p.s = Math.max(0.5, Math.min(3, Math.round(dist / 30 * 20) / 20));
    sd.el.style.fontSize = Math.round(44 * p.s) + "px";
  } else {
    const p = state.placed.find(x => x.id === sd.id), pt = toPhone(ev.clientX, ev.clientY);
    p.x = Math.max(10, Math.min(350, pt.x + sd.ox)); p.y = Math.max(10, pt.y + sd.oy);
    sd.el.style.left = p.x + "px"; sd.el.style.top = p.y + "px";
  }
}
function sEnd() { removeEventListener("pointermove", sMove); removeEventListener("pointerup", sUp); removeEventListener("pointercancel", sCancel); if (sd && sd.ghost) sd.ghost.remove(); }
function sUp(ev) {
  if (!sd) return;
  const d = sd; sEnd(); sd = null;
  if (d.kind === "new") {
    if (!d.on) { const r = scr.getBoundingClientRect(), sc = r.width / 360; return addSticker(d.e, 180 + Math.round(Math.random() * 120 - 60), Math.round($("phScroll").scrollTop + 260 + Math.random() * 120 - 60)); }
    if (overPhone(ev.clientX, ev.clientY)) { const pt = toPhone(ev.clientX, ev.clientY); addSticker(d.e, pt.x, pt.y); }
    return;
  }
  if (!d.on) state.selS = state.selS === d.id ? null : d.id; else state.selS = d.id;
  renderAll();
}
function sCancel() { sEnd(); sd = null; renderPhone(); }

renderAll();
</script>
